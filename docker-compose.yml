services:
  api:
    build: .
    container_name: financial-crewai-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: python -m uvicorn api.app:app --host 0.0.0.0 --port 8000

  streamlit:
    build: .
    container_name: financial-crewai-streamlit
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000/query
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run streamlit_app/main.py --server.address 0.0.0.0 --server.port 8501 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
